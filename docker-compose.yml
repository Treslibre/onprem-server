services:
  postgres:
    image: postgres:16-alpine
    container_name: threema-onprem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threema_onprem_pg}
      POSTGRES_DB: ${POSTGRES_DB:-threema_onprem}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - threema_onprem_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-threema} -d $${POSTGRES_DB:-threema_onprem}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  threema_onprem_pgdata:
